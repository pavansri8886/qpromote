name: QPromote evaluation

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  evaluate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run QPromote pipeline
        run: python qpromote.py run pipeline.yaml
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qpromote-results
          path: |
            qpromote_report.html
            qpromote_evidence.db
          if-no-files-found: error
