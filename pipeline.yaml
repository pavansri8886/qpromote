# QPromote pipeline — full evaluation (5 circuits)
project: QPromote Thesis Evaluation
db_path: qpromote_evidence.db
shots: 4096
halt_on_block: false
report_path: qpromote_report.html

stages:
  # Bell state — Stage 1
  - name: stage1_bell
    backend: aer_simulator
    circuit: bell
    thresholds:
      fidelity: 0.90

  # Bell state — Stage 2
  - name: stage2_bell
    backend: FakeManilaV2
    circuit: bell
    thresholds:
      hellinger_fidelity: 0.90
      tvd: 0.10

  # Bell state — Stage 3
  - name: stage3_bell
    backend: FakeSherbrooke
    circuit: bell

  # GHZ — Stage 1
